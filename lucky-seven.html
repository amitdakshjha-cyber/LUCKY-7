<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucky Seven</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e3b2e;--card:#f6f3ea;--ink:#13201a;--gold:#f2c14e;--red:#d64545;--mute:#5b6b62;--line:#d9d4c3;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#fff;font-family:"Bricolage Grotesque",system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.4}
main{max-width:560px;margin:0 auto;padding:18px 14px 48px}
h1{margin:0 0 12px;font-size:2.4rem;font-weight:800;letter-spacing:-.02em}
h1 b{color:var(--gold)}
h2{margin:0 0 8px;font-size:1.15rem}
.card{background:var(--card);color:var(--ink);border-radius:14px;padding:14px;margin:0 0 12px}
label{display:block;font-size:.85rem;color:var(--mute);margin:10px 0 3px}
input,select{width:100%;font:inherit;padding:10px;border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
button{font:inherit;font-weight:800;border:0;border-radius:10px;padding:10px 14px;background:var(--ink);color:var(--gold);cursor:pointer}
button.big{width:100%;margin-top:10px;padding:14px;background:var(--gold);color:var(--ink);font-size:1.05rem}
button.alt{background:var(--red);color:#fff}
button.ghost{background:transparent;color:var(--gold);text-decoration:underline;font-weight:500}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tabs button{flex:1;background:#164d3c;color:#cfe8dc}
.tabs button.on{background:var(--gold);color:var(--ink)}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:6px 4px;text-align:left;border-bottom:1px solid var(--line)}
th{font-size:.75rem;color:var(--mute);font-weight:500}
td+td,th+th{text-align:right}
.co{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.co:last-child{border:0}
.co small{color:var(--mute)}
.tr{display:flex;align-items:center;gap:8px}
.tr span{min-width:22px;text-align:center;font-weight:800}
.msg{background:var(--gold);color:var(--ink);border-radius:10px;padding:10px 12px;margin:0 0 12px;font-weight:500}
.log{margin:8px 0 0;padding-left:18px;font-size:.92rem}
.row2{display:grid;grid-template-columns:1fr 90px;gap:8px}
.up{color:#1c8a4e;font-weight:800}.dn{color:var(--red);font-weight:800}
</style>
</head>
<body>
<main id="app"></main>
<script>
const $=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n.toLocaleString('en-IN');
const sgn=n=>(n>0?'+':'')+fmt(n);
const d6=()=>1+Math.floor(Math.random()*6);
const STOCK=10000,MAXHOLD=10;
let tab='stocks',S=null;
try{S=JSON.parse(localStorage.getItem('l7'))}catch(e){}
function save(){try{localStorage.setItem('l7',JSON.stringify(S))}catch(e){}}
function go(t){tab=t;view()}
function msg(m){S.msg=m;save();view()}
const val=p=>p.cash+p.hold.reduce((a,h,i)=>a+h*(STOCK+S.comps[i].val),0);

function setup(){
  $.innerHTML=`<h1>Lucky <b>7</b></h1><div class="card"><h2>Players</h2>
  <label for="pl">Names, separated by commas (2 or more)</label><input id="pl" placeholder="Atharv, Riya, Kabir">
  <h2 style="margin-top:14px">Four companies</h2>
  ${[0,1,2,3].map(i=>`<input id="c${i}" maxlength="20" placeholder="Company ${i+1}" style="margin-top:6px">`).join('')}
  <div class="row2"><div><label for="cash">Starting cash</label><input id="cash" type="number" value="100000"></div><div><label for="ch">Chits</label><input id="ch" type="number" value="10"></div></div>
  <div id="err" class="dn"></div><button class="big" onclick="start()">Start game</button></div>`;
}
function start(){
  const names=document.getElementById('pl').value.split(',').map(s=>s.trim()).filter(Boolean);
  if(names.length<2){document.getElementById('err').textContent='Add at least 2 players.';return}
  const cash=+document.getElementById('cash').value||100000,ch=+document.getElementById('ch').value||10;
  S={players:names.map(n=>({name:n,cash,chits:ch,hold:[0,0,0,0]})),
     comps:[0,1,2,3].map(i=>({name:document.getElementById('c'+i).value.trim()||'Company '+(i+1),val:0})),
     acting:0,round:1,log:[],msg:'',seven:{w:0,step:'write',num:null,res:null}};
  save();view();
}

function view(){
  if(!S){setup();return}
  const board=S.players.map(p=>`<tr><td>${esc(p.name)}</td><td>${fmt(val(p))}</td><td>${p.chits}</td></tr>`).join('');
  $.innerHTML=`<h1>Lucky <b>7</b></h1>
  <div class="card"><table><tr><th>Player</th><th>Net worth</th><th>Chits</th></tr>${board}</table></div>
  <div class="tabs"><button class="${tab==='stocks'?'on':''}" onclick="go('stocks')">Stock game</button><button class="${tab==='seven'?'on':''}" onclick="go('seven')">Lucky Seven</button></div>
  ${S.msg?`<div class="msg">${esc(S.msg)}</div>`:''}
  ${tab==='stocks'?stocks():seven()}
  <button class="ghost" onclick="reset()">New game</button>`;
}
function reset(){if(confirm('Start over? This clears the current game.')){S=null;try{localStorage.removeItem('l7')}catch(e){}view()}}

function stocks(){
  const p=S.players[S.acting];
  const opts=S.players.map((q,i)=>`<option value="${i}" ${i===S.acting?'selected':''}>${esc(q.name)}</option>`).join('');
  const rows=S.comps.map((c,i)=>{const sell=STOCK+c.val,buy=Math.max(0,sell);
    return `<div class="co"><div><b>${esc(c.name)}</b><br><small>Value ${fmt(c.val)} · Buy ${fmt(buy)} · Sell ${fmt(sell)}</small></div>
    <div class="tr"><button onclick="buy(${i})">Buy</button><span>${p.hold[i]}</span><button class="alt" onclick="sell(${i})">Sell</button></div></div>`}).join('');
  const log=S.log.length?`<h2>Round ${S.round-1} results</h2><ul class="log">${S.log.map(l=>`<li>${l}</li>`).join('')}</ul>`:'';
  return `<div class="card"><label for="ap">Whose turn to trade</label><select id="ap" onchange="S.acting=+this.value;save();view()">${opts}</select>
  <p style="margin:8px 0 0">Cash: <b>${fmt(p.cash)}</b></p>${rows}</div>
  <div class="card"><button class="big" style="margin:0" onclick="roll()">Roll round ${S.round}</button>${log}</div>`;
}
function buy(i){
  const p=S.players[S.acting],c=S.comps[i],price=Math.max(0,STOCK+c.val);
  if(p.hold[i]>=MAXHOLD)return msg(`${p.name} already holds ${MAXHOLD} of ${c.name}.`);
  if(p.cash<price)return msg(`${p.name} can't afford ${fmt(price)}.`);
  p.cash-=price;p.hold[i]++;msg(`${p.name} bought ${c.name} for ${price?fmt(price):'free'}.`);
}
function sell(i){
  const p=S.players[S.acting],c=S.comps[i],get=STOCK+c.val;
  if(!p.hold[i])return msg(`${p.name} has no ${c.name} to sell.`);
  p.cash+=get;p.hold[i]--;msg(get<0?`${p.name} sold ${c.name} and ${fmt(-get)} was taken from the account.`:`${p.name} sold ${c.name} for ${fmt(get)}.`);
}
function dice(){
  const a=d6();
  if(a===1)return[-1e4,'1'];if(a===2)return[-2e4,'2'];if(a===5)return[1e4,'5'];if(a===6)return[2e4,'6'];
  const b=d6(),t=a+', re-roll '+b;
  if(b===3)return[-5e4,t];if(b===4)return[5e4,t];
  return[[0,-1e4,-2e4,0,0,1e4,2e4][b],t];
}
function roll(){
  S.log=S.comps.map(c=>{const[ch,t]=dice();c.val+=ch;return `${esc(c.name)}: rolled ${t} <span class="${ch>0?'up':'dn'}">${sgn(ch)}</span> (now ${fmt(c.val)})`});
  S.round++;S.msg='';save();view();
}

function seven(){
  const s=S.seven,w=S.players[s.w];
  if(s.step==='write')return `<div class="card"><h2>${esc(w.name)} writes a number</h2><p>Everyone else look away. Pick 1 to 13.</p>
  <input id="num" type="password" inputmode="numeric" maxlength="2" aria-label="Secret number"><button class="big" onclick="lock()">Lock it in</button></div>`;
  if(s.step==='bet'){
    const rows=S.players.map((p,j)=>j===s.w?'':`<div class="co"><div><b>${esc(p.name)}</b><br><small>${p.chits} chits</small></div>
      <div class="tr"><select id="pk${j}" aria-label="Guess"><option value="b">Below 7</option><option value="s">Exactly 7</option><option value="a">Above 7</option></select>
      <input id="bt${j}" type="number" min="0" max="${p.chits}" value="0" style="width:70px" aria-label="Chits to bet"></div></div>`).join('');
    return `<div class="card"><h2>${esc(w.name)} has locked a number</h2><p>Others: pick below, exactly, or above 7 and bet chits.</p>${rows}<button class="big" onclick="reveal()">Reveal number</button></div>`;
  }
  return `<div class="card"><h2>The number was ${s.num}</h2><ul class="log">${s.res.map(l=>`<li>${l}</li>`).join('')}</ul><button class="big" onclick="nextSeven()">Next writer</button></div>`;
}
function lock(){
  const n=Math.round(+document.getElementById('num').value);
  if(!(n>=1&&n<=13))return msg('Pick a whole number from 1 to 13.');
  S.seven.num=n;S.seven.step='bet';S.msg='';save();view();
}
function reveal(){
  const s=S.seven,act=s.num<7?'b':s.num===7?'s':'a';
  s.res=[];
  S.players.forEach((p,j)=>{
    if(j===s.w)return;
    const pick=document.getElementById('pk'+j).value;
    const bet=Math.max(0,Math.min(p.chits,Math.floor(+document.getElementById('bt'+j).value||0)));
    if(!bet){s.res.push(`${esc(p.name)} sat out.`);return}
    const win=pick===act,mult=pick==='s'?3:2,delta=win?bet*(mult-1):-bet;
    p.chits+=delta;
    s.res.push(`${esc(p.name)} bet ${bet}: <span class="${win?'up':'dn'}">${win?'won '+bet*mult+' chits':'lost '+bet}</span>`);
  });
  s.step='done';S.msg='';save();view();
}
function nextSeven(){const s=S.seven;s.w=(s.w+1)%S.players.length;s.step='write';s.num=null;s.res=null;save();view()}
view();
</script>
</body>
</html>
